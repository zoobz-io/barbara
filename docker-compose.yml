# Local development stack. Services are grouped by profile so you start only the
# surface you're working on:
#   make dev-api            # public API + its dependencies
#   make dev-admin          # admin API + its dependencies
#   make dev                # both surfaces + shared dependencies
#   make dev-observability  # optional telemetry stack (Grafana/Jaeger/…)
# The shared build/env/deps below are reused by the api and admin containers.

x-app-build: &app-build
  context: .
  dockerfile: tools/dev/Dockerfile.dev

# Shared environment for the app containers. Per-surface ports and service names
# are set on each service.
x-app-env: &app-env
  APP_DB_HOST: postgres
  APP_DB_PORT: "5432"
  APP_DB_NAME: Barbara
  APP_DB_USER: Barbara
  APP_DB_PASSWORD: Barbara
  APP_DB_SSLMODE: disable
  APP_REDIS_ADDR: redis:6379
  APP_STORAGE_ENDPOINT: minio:9000
  APP_STORAGE_ACCESS_KEY: Barbara
  APP_STORAGE_SECRET_KEY: Barbaradev
  APP_STORAGE_BUCKET: Barbara
  APP_STORAGE_USE_SSL: "false"
  APP_OPENSEARCH_ADDR: http://opensearch:9200
  APP_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318

# Shared dependency set for the app containers: infra up and migrations/bucket ready.
x-app-deps: &app-deps
  postgres:
    condition: service_healthy
  migrate:
    condition: service_completed_successfully
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  opensearch:
    condition: service_healthy

services:
  # =============================================================================
  # Core Infrastructure (started by any app profile, not by observability alone)
  # =============================================================================

  postgres:
    profiles: ["api", "admin"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: Barbara
      POSTGRES_USER: Barbara
      POSTGRES_PASSWORD: Barbara
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U Barbara"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    profiles: ["api", "admin"]
    image: ghcr.io/kukymbr/goose-docker:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=Barbara password=Barbara dbname=Barbara sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations

  redis:
    profiles: ["api", "admin"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    profiles: ["api", "admin"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: Barbara
      MINIO_ROOT_PASSWORD: Barbaradev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: create the assets bucket so the app can write on first boot
  # (boot.Bucket builds the client but does not create the bucket).
  minio-init:
    profiles: ["api", "admin"]
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 Barbara Barbaradev &&
      mc mb --ignore-existing local/Barbara
      "

  opensearch:
    profiles: ["api", "admin"]
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # =============================================================================
  # Applications (one profile each — start only what you need)
  # =============================================================================

  api:
    profiles: ["api"]
    build: *app-build
    command: ["air", "-c", "tools/dev/air.api.toml"]
    depends_on: *app-deps
    environment:
      <<: *app-env
      APP_PORT: "8080"
      OTEL_SERVICE_NAME: barbara-api
    ports:
      - "8080:8080"
    volumes:
      - .:/app

  admin:
    profiles: ["admin"]
    build: *app-build
    command: ["air", "-c", "tools/dev/air.admin.toml"]
    depends_on: *app-deps
    environment:
      <<: *app-env
      APP_ADMIN_PORT: "8081"
      OTEL_SERVICE_NAME: barbara-admin
    ports:
      - "8081:8081"
    volumes:
      - .:/app

  # =============================================================================
  # Observability Stack (optional — `--profile observability`)
  # =============================================================================

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI

  loki:
    profiles: ["observability"]
    image: grafana/loki:latest
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - lokidata:/loki

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    volumes:
      - ./tools/dev/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ./tools/dev/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4318:4318" # OTLP HTTP
    depends_on:
      - jaeger
      - loki
      - prometheus

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./tools/dev/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  pgdata:
  redisdata:
  miniodata:
  opensearchdata:
  lokidata:
  prometheusdata:
  grafanadata:
