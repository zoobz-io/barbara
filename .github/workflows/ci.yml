name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.24', '1.25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --config=.golangci.yml --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: securego/gosec@v2.22.11
        with:
          args: '-fmt sarif -out gosec-results.sarif --no-fail ./...'
      - uses: github/codeql-action/upload-sarif@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barbara
          POSTGRES_PASSWORD: barbara
          POSTGRES_DB: barbara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barbara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_DB_HOST: localhost
      APP_DB_PORT: "5432"
      APP_DB_USER: barbara
      APP_DB_PASSWORD: barbara
      APP_DB_NAME: barbara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      # A real Postgres lets the jobs-store integration tests run (they skip
      # when it is absent), so store coverage is measured rather than zero.
      - name: Run migrations
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=barbara password=barbara dbname=barbara sslmode=disable" up
      - run: make coverage
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: make test-bench | tee benchmark_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt

  ci-complete:
    name: CI Complete
    needs: [test, lint, security, coverage, benchmark]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI complete"
