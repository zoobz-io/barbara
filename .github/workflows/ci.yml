name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: barbara
          POSTGRES_PASSWORD: barbara
          POSTGRES_DB: barbara
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U barbara"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
    env:
      APP_DB_HOST: localhost
      APP_DB_PORT: "5432"
      APP_DB_USER: barbara
      APP_DB_PASSWORD: barbara
      APP_DB_NAME: barbara
      APP_OPENSEARCH_ADDR: http://localhost:9200
      APP_STORAGE_ENDPOINT: localhost:9000
      APP_STORAGE_ACCESS_KEY: minioadmin
      APP_STORAGE_SECRET_KEY: minioadmin
      APP_STORAGE_BUCKET: barbara
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Pin to the toolchain go.mod declares. "1.25" resolves to whatever
          # the latest patch is, and some of those (e.g. go1.25.14) ship a
          # broken covdata that fails coverage of test-less packages.
          go-version: '1.25.3'
      # Give the integration suite the real infra it needs (Postgres +
      # OpenSearch) so boot and the stores are exercised end to end under -race
      # instead of skipped. goose comes from its prebuilt binary — `go install`
      # of the CLI compiles every driver it ships and is slow and flaky.
      - name: Run migrations
        run: |
          curl -fsSL https://github.com/pressly/goose/releases/download/v3.24.1/goose_linux_x86_64 \
            -o /usr/local/bin/goose && chmod +x /usr/local/bin/goose
          goose -dir database/migrations postgres \
            "host=localhost port=5432 user=barbara password=barbara dbname=barbara sslmode=disable" up
      - name: Wait for OpenSearch
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9200/_cluster/health && break
            sleep 3
          done
      # Object storage for the assets suite. The official minio image needs a
      # "server" command, which a service container can't supply, so run it as a
      # step where we control the command. The asset store creates the bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
      - name: Wait for MinIO
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 3
          done
      # One pass: race-checked tests + coverage profile (make test emits coverage.out).
      - run: make test
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.7.2
          args: --config=.golangci.yml --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: securego/gosec@v2.22.11
        with:
          args: '-fmt sarif -out gosec-results.sarif --no-fail ./...'
      - uses: github/codeql-action/upload-sarif@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        with:
          sarif_file: gosec-results.sarif

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: make test-bench | tee benchmark_results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt

  ci-complete:
    name: CI Complete
    needs: [test, lint, security, benchmark]
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI complete"
