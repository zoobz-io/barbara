version: "2"

run:
  timeout: 5m
  tests: true
  build-tags:
    - integration

linters:
  enable:
    # Security
    - gosec
    - errorlint
    - noctx
    - bodyclose
    - sqlclosecheck
    # Quality
    - govet
    - ineffassign
    - staticcheck
    - unused
    - errcheck
    - errchkjson
    - wastedassign
    # Best practices
    - gocritic
    - revive
    - unconvert
    - dupl
    - goconst
    - godot
    - misspell
    - prealloc
    - copyloopvar

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - funlen
          - goconst
          - dupl
          - govet
      # The mdast and hast node types carry a package-name prefix on purpose:
      # rocco names an OpenAPI schema after the bare Go type name, and both trees
      # have a root and a text node, so the prefix keeps their schemas distinct.
      # The resulting stutter (mdast.MdastRoot, hast.HastRoot) is intended.
      - path: internal/(mdast|hast)/node\.go
        linters:
          - revive
        text: stutters

  settings:
    errcheck:
      check-type-assertions: true
    govet:
      enable-all: true
    dupl:
      threshold: 150
    goconst:
      min-len: 3
      min-occurrences: 3
