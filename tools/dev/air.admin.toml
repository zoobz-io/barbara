# Air hot-reload config for the admin (authoring) surface (cmd/admin).
root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/admin"
  cmd = "go build -o ./tmp/admin ./cmd/admin"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "docker", "migrations", "web"]
  exclude_regex = ["_test.go"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "2s"
  log = "build-errors.log"
  stop_on_error = true

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true
