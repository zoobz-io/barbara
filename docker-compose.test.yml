# Disposable backing services for the integration suite. Separate from the dev
# stack on purpose: the suite wipes tables and empties the search index, so it
# must never share a database, bucket, or cluster with `make dev`. Everything
# here is ephemeral (no named volumes) and listens on offset ports that the
# suite's defaults point at; `make test-integration` brings it up, migrates,
# runs the suite, and tears it down.
name: barbara-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barbara
      POSTGRES_USER: barbara
      POSTGRES_PASSWORD: barbara
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbara"]
      interval: 2s
      timeout: 5s
      retries: 15

  migrate:
    image: ghcr.io/kukymbr/goose-docker:latest
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./database/migrations:/migrations:ro
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: "host=postgres port=5432 user=barbara password=barbara dbname=barbara sslmode=disable"
      GOOSE_MIGRATION_DIR: /migrations

  minio:
    image: quay.io/minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >-
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/barbara
      "

  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "19200:9200"
    # An anonymous volume, not tmpfs: the node runs as its own user and cannot
    # write a root-owned tmpfs. `down -v` still discards it.
    volumes:
      - /usr/share/opensearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 24
